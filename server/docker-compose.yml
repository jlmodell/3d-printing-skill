services:
  cad-server:
    build: .
    container_name: cad-server
    ports:
      # Published to LOOPBACK ONLY, deliberately.
      #
      # This service executes arbitrary Python by design (that is what
      # /model/create is). A bare "8123:8123" would publish it on every host
      # interface, putting an unauthenticated remote-code-execution endpoint on
      # your LAN for anyone on the same wifi to POST to. The 127.0.0.1 prefix is
      # what keeps it reachable only from this machine.
      #
      # Do not remove the 127.0.0.1 prefix. If you need it from another machine,
      # tunnel over SSH (ssh -L 8123:127.0.0.1:8123 user@host) instead of
      # publishing it.
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
